name: yap
on:
  push:
    branches:
      - master
      - main
    paths:
      - "yapserver/**"
      - "yapdesktop/**"
      - ".github/workflows/yap.yml"
  pull_request:
    paths:
      - "yapserver/**"
      - "yapdesktop/**"
      - ".github/workflows/yap.yml"

permissions: {}

jobs:
  yapserver:
    name: yapserver tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: yapserver
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: yapserver/go.mod
          cache-dependency-path: yapserver/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build container image
        run: docker build -t yapserver:ci .

  yapdesktop:
    name: yapdesktop tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: yapdesktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: yapdesktop/.nvmrc
          cache: npm
          cache-dependency-path: yapdesktop/package-lock.json

      - name: Test
        # The unit tests don't need Electron, so skip downloading it.
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --ignore-scripts
          npm test
