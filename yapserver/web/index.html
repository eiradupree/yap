<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yap</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/heroui/heroui.css">
  <link rel="stylesheet" href="ui/theme.css">
  <link rel="stylesheet" href="ui/actions.css">
  <link rel="stylesheet" href="ui/display.css">
  <link rel="stylesheet" href="ui/overlays.css">
  <link rel="stylesheet" href="ui/menus.css">
  <link rel="stylesheet" href="ui/dialogs.css">
  <link rel="stylesheet" href="ui/toast.css">
  <link rel="stylesheet" href="ui/forms.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calls.css">
  <script src="ui/core.js" defer></script>
  <script src="ui/actions.js" defer></script>
  <script src="ui/display.js" defer></script>
  <script src="ui/overlays.js" defer></script>
  <script src="ui/menus.js" defer></script>
  <script src="ui/dialogs.js" defer></script>
  <script src="ui/toast.js" defer></script>
  <script src="ui/forms.js" defer></script>
  <script src="editor.js" defer></script>
  <script src="app.js" defer></script>
  <script src="vendor/livekit-client.umd.js" defer></script>
  <script src="calls.js" defer></script>
</head>
<body>
  <main id="auth" class="auth" hidden>
    <div class="auth-card">
      <h1>Yap</h1>
      <p id="auth-sub" class="muted">Sign in to continue</p>
      <!-- app.js builds #auth-form here with YapUI.Form -->
    </div>
  </main>

  <div id="app" class="app" hidden>
    <aside class="sidebar" aria-label="Channels and account">
      <header class="sidebar-head">
        <strong class="brand">Yap</strong>
        <button id="logout" class="button button--ghost button--sm" data-slot="button" type="button">Sign out</button>
      </header>
      <p id="me" class="muted me"></p>
      <div class="sidebar-links">
        <button id="account" class="button button--ghost button--sm" data-slot="button" type="button">Account</button>
        <button id="members" class="button button--ghost button--sm" data-slot="button" type="button" hidden>Members</button>
      </div>
      <button id="notify" class="button button--secondary button--sm notify" data-slot="button" type="button" hidden>Turn on notifications</button>
      <h2 id="channels-heading">Channels</h2>
      <ul id="channels" class="channels" aria-labelledby="channels-heading"></ul>
      <form id="new-channel" class="new-channel" novalidate>
        <div class="new-channel-row">
          <input id="new-channel-name" class="input input--primary" data-slot="input" placeholder="new-channel" maxlength="32" aria-label="New channel name" aria-describedby="new-channel-error" autocomplete="off" spellcheck="false">
          <button id="new-channel-submit" type="submit" class="button button--secondary button--icon-only button--md" data-slot="button" aria-label="Create channel"></button>
        </div>
      </form>
    </aside>
    <section class="chat" aria-label="Messages">
      <header class="chat-head">
        <h1 id="channel-title"># </h1>
        <span id="conn" class="conn"></span>
        <button id="leave" class="button button--ghost button--sm" data-slot="button" type="button">Leave</button>
      </header>
      <div id="join-banner" class="join-banner" hidden>
        <p>You're not in this channel.</p>
        <button id="join" class="button button--primary" data-slot="button" type="button">Join channel</button>
      </div>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="composer" class="composer"></form>
    </section>
    <aside id="thread" class="thread" hidden aria-label="Thread">
      <header class="chat-head">
        <h1>Thread</h1>
        <button id="thread-close" class="close-button close-button--default" data-slot="close-button" type="button" aria-label="Close thread"></button>
      </header>
      <ol id="thread-messages" class="messages" aria-live="polite"></ol>
      <form id="thread-composer" class="composer"></form>
    </aside>
  </div>
</body>
</html>
