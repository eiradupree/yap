# Fly.io deployment for the Yap server. See yapserver/DEPLOY.md.
# `app` is set when the app is created; change it if you fork this.
app = "yap-chat-712e13"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly terminates HTTPS and forwards requests, appending the client IP to X-Forwarded-For.
  YAP_SECURE_COOKIES = "true"
  YAP_BEHIND_PROXY = "true"
  # YAP_INVITE_CODE is a secret: `fly secrets set YAP_INVITE_CODE=...`

# SQLite lives on this volume, so exactly one machine runs.
[mounts]
  source = "yap_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A chat server holds websockets open; keep it running rather than scaling to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Each open browser tab is one websocket connection.
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    method = "GET"
    path = "/api/ping"
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
